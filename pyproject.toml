[project]
name = "civic"
version = "0.1.0"
description = "MP baseball cards: who your MP is and what they actually do"
requires-python = ">=3.11"
dependencies = ["httpx", "typer", "anthropic"]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools]
packages = ["civic", "civic.sources", "civic.analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
