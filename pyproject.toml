[project]
name = "civic"
version = "0.1.0"
description = "Civic Leverage Tool: where can you still change an outcome?"
requires-python = ">=3.11"
dependencies = ["httpx", "typer", "anthropic"]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools]
packages = ["civic", "civic.sources", "civic.analysis", "civic.ranking", "civic.actions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
